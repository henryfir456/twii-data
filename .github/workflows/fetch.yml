name: fetch-twii
on:
  push:
    paths: [.github/workflows/fetch.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download TAIEX daily history from Yahoo
        run: |
          for h in query1 query2; do
            curl -sf -A "Mozilla/5.0" "https://$h.finance.yahoo.com/v8/finance/chart/%5ETWII?period1=1199145600&period2=$(date +%s)&interval=1d" -o twii.json && break
          done
          python3 -c "import json;r=json.load(open('twii.json'))['chart']['result'][0];print(len(r['timestamp']))"
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add twii.json && git commit -m "data: TAIEX history" && git push
